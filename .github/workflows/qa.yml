name: QA

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflows:
    uses: sympress/workflows/.github/workflows/lint-workflows.yml@a044303b8492b0c6be48bd9c9fccdc36fb0a9794
  qa:
    uses: sympress/workflows/.github/workflows/sympress-qa.yml@a044303b8492b0c6be48bd9c9fccdc36fb0a9794
    with:
      php_version: '8.5'
      php_extensions: pdo_sqlite
