name: Database integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    name: Native kernel / ${{ matrix.database }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database: [mariadb, postgresql]
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: sympress_doctrine_test
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=12
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: sympress_doctrine_test
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: pdo_mysql, pdo_pgsql, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run MariaDB acceptance
        if: matrix.database == 'mariadb'
        env:
          DOCTRINE_TEST_DATABASE_URL: mysql://root@127.0.0.1:3306/sympress_doctrine_test
        run: composer tests:database
      - name: Run PostgreSQL acceptance
        if: matrix.database == 'postgresql'
        env:
          DOCTRINE_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/sympress_doctrine_test?serverVersion=17.0.0
        run: composer tests:database
